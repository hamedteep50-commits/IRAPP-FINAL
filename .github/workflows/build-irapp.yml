name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract IRAPP ZIP
        run: |
          mkdir -p irapp
          unzip -o IRAPP_v4.1.1_COMPLETE_2026-09-25.zip -d irapp
          find irapp -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          find irapp -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd "$(dirname "$(find irapp -name settings.gradle | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: |
            irapp/**/build/outputs/apk/**/*.apk
            irapp/**/build/outputs/apk/*.apk
