name: IRAPP Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'IRAPP_v4.3.1_SUPABASE_CONNECT.zip'
      - '.github/workflows/irapp.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build IRAPP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project ZIP
        run: |
          set -e
          test -f IRAPP_v4.3.1_SUPABASE_CONNECT.zip

      - name: Extract Project ZIP
        run: |
          mkdir -p irapp
          unzip -q IRAPP_v4.3.1_SUPABASE_CONNECT.zip -d irapp

      - name: Find Android Project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find irapp -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found."
            exit 1
          fi

          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: irapp/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
