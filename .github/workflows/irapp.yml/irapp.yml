name: IRAPP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IRAPP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p irapp
          unzip -q "$ZIP_FILE" -d irapp

      - name: Find Android Project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find irapp -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings not found."
            find irapp -maxdepth 6 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          APK=$(find irapp -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: irapp/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
