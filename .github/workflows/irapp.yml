name: IRAPP Build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check IRAPP ZIP
        shell: bash
        run: |
          echo "Checking IRAPP project ZIP..."
          ls -la

          if [ ! -f "IRAPP_v4.3.1_SUPABASE_CONNECT.zip" ]; then
            echo "ERROR: IRAPP_v4.3.1_SUPABASE_CONNECT.zip not found."
            echo "Available ZIP files:"
            find . -maxdepth 4 -type f -name "*.zip"
            exit 1
          fi

      - name: Extract IRAPP ZIP
        shell: bash
        run: |
          mkdir -p irapp
          unzip -q IRAPP_v4.3.1_SUPABASE_CONNECT.zip -d irapp
          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS=$(find irapp -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            find irapp -maxdepth 6 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          adb version
          sdkmanager --list_installed

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.3.1-APK
          path: |
            irapp/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
