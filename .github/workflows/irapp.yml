
name: IRAPP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check IRAPP ZIP
        run: |
          echo "Checking project ZIP..."
          ls -la
          if [ ! -f "IRAPP_v4.3.1_SUPABASE_CONNECT.zip" ]; then
            echo "ERROR: IRAPP ZIP file not found."
            exit 1
          fi

      - name: Extract IRAPP ZIP
        run: |
          mkdir -p irapp
          unzip -q IRAPP_v4.3.1_SUPABASE_CONNECT.zip -d irapp
          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS=$(find irapp -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            find irapp -maxdepth 5 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT ROOT: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          echo "Android SDK path: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK" -type f -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found on runner."
            find "$SDK" -maxdepth 4 -type d | head -100
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          adb version
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.3.1-APK
          path: irapp/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
