name: IRAPP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check IRAPP ZIP
        shell: bash
        run: |
          set -e
          ZIP="IRAPP_v4.3.1_SUPABASE_CONNECT.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            find . -maxdepth 5 -type f -name "*.zip"
            exit 1
          fi

      - name: Extract IRAPP ZIP
        shell: bash
        run: |
          set -e
          mkdir -p irapp
          unzip -q IRAPP_v4.3.1_SUPABASE_CONNECT.zip -d irapp

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find irapp -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            find irapp -maxdepth 6 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          adb version
          sdkmanager --list_installed

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-art
