name: Build IRAPP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: باز کردن فایل ZIP
        run: |
          mkdir project
          unzip -q IRAPP_HAMED_FINAL_2.0.3.zip -d project

      - name: پیدا کردن Gradle
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew پیدا نشد"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ساخت APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: دریافت APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: project/**/build/outputs/apk/**/*.apk
