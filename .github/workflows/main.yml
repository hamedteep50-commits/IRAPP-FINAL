name: Build IRAPP Unified Final APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: پیدا کردن و باز کردن فایل نهایی
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "IRAPP_UNIFIED_FINAL_v3.2_GITHUB_READY.zip" | head -1)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

      - name: تنظیم Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تنظیم Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: نصب Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: ساخت APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug

      - name: ذخیره APK نهایی
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-UNIFIED-FINAL-v3.2-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
