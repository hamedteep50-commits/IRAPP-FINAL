name: Build IRAPP v3.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: پیدا کردن و باز کردن ZIP نهایی IRAPP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'IRAPP_UNIFIED_FINAL_v3.3_BUTTONS_FIXED_GITHUB_READY.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ فایل ZIP نهایی پیدا نشد"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ پروژه Android پیدا نشد"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ پروژه پیدا شد: $PROJECT_DIR"

      - name: ساخت APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: بررسی APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v3.3-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
