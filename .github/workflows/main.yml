name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip IRAPP source
        run: |
          rm -rf irapp
          mkdir -p irapp
          unzip -q IRAPP_v4.1.1_COMPLETE_2026-09-25.zip -d irapp

          echo "=== Finding Gradle wrapper ==="
          find irapp -type f -name gradlew -print

          GRADLEW=$(find irapp -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find irapp -maxdepth 4 -type f | head -200
            exit 1
          fi

          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          GRADLEW=$(find irapp -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          cd "$(dirname "$GRADLEW")"

          chmod +x ./gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Building IRAPP APK ==="
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "=== APK files ==="
          find irapp -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: irapp/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
