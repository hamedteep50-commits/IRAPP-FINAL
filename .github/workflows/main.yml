name: Extract and Build IRAPP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract IRAPP ZIP
        run: |
          unzip -q IRAPP_SUPER_PLATFORM_v4.3.0_MASTER.zip -d extracted
          echo "ZIP extracted."
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT ROOT: $ROOT"

          rsync -a "$ROOT"/ ./ --exclude='.git'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: app/build/outputs/apk/debug/*.apk
