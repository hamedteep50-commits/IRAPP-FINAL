name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract IRAPP v4.1.1 ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'IRAPP_v4.1.1_COMPLETE_2026-09-25.zip' | head -1)
          test -n "$ZIP"
          mkdir -p irapp-build
          unzip -q "$ZIP" -d irapp-build

      - name: Locate Android project
        run: |
          PROJECT=$(find irapp-build -type f -name settings.gradle -print -quit | xargs dirname)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build IRAPP APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload IRAPP APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
