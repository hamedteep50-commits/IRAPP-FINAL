name: Build IRAPP Unified Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: نصب Gradle 8.7
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: بررسی پروژه
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== App files ==="
          ls -la app
          echo "=== Java files ==="
          find app/src/main/java -type f

      - name: ساخت APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: بررسی APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: قرار دادن APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-UNIFIED-FINAL-v3.3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
