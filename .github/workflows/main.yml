name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip IRAPP source
        run: unzip -q IRAPP_SUPER_PLATFORM_v4.1.1_GITHUB_READY_CLEAN.zip -d irapp

      - name: Build APK
        run: |
          find irapp -name gradlew -type f -exec chmod +x {} \;
          GRADLEW=$(find irapp -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: irapp/**/build/outputs/apk/**/*.apk
