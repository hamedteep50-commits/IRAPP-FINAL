name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          echo "=== Repository files ==="
          ls -lah
          echo "=== IRAPP ZIP ==="
          ls -lh IRAPP_v4.1.1_COMPLETE_2026-09-25.zip

      - name: Unzip IRAPP source
        run: |
          rm -rf irapp
          mkdir -p irapp
          unzip -q IRAPP_v4.1.1_COMPLETE_2026-09-25.zip -d irapp

          echo "=== Extracted structure ==="
          find irapp -maxdepth 4 -type f | head -200

          echo "=== Finding Gradle wrapper ==="
          find irapp -type f -name gradlew -print

          GRADLEW=$(find irapp -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find irapp -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Building APK ==="
          ./gradlew assembleDebug --stacktrace --info

      - name: Find APK
        if: success()
        run: |
          echo "=== APK files ==="
          find irapp -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: irapp/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
