name: Build IRAPP Unified Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Find ZIP
        run: |
          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract IRAPP project
        run: |
          mkdir -p project
          unzip -q IRAPP_UNIFIED_FINAL_v3.3_BUTTONS_FIXED_GITHUB_READY.zip -d project

      - name: Find Gradle project
        run: |
          find project -maxdepth 3 -name "gradlew" -print

      - name: Build APK
        run: |
          GRADLEW=$(find project -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew پیدا نشد"
            exit 1
          fi
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-UNIFIED-FINAL-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
