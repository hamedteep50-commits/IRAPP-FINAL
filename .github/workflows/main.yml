name: Build IRAPP v4.1.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip IRAPP source
        run: |
           unzip -q IRAPP_v4.1.1_COMPLETE_2026-09-25.zip -d irapp
    find irapp -name gradlew -type f -exec chmod +x {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: irapp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-v4.1.1-APK
          path: irapp/**/build/outputs/apk/**/*.apk
