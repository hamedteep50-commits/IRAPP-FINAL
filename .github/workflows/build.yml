name: Build IRAPP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Project root:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -type f \( -name "build.gradle" -o -name "settings.gradle" -o -name "gradle.properties" \) -print

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: app/build/outputs/apk/debug/*.apk
