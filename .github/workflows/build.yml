name: Build IRAPP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Find Android project
        run: |
          echo "Searching entire repository..."

          find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print

      - name: Build APK
        run: |
          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found."
            echo "Repository structure:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "FOUND SETTINGS: $SETTINGS"
          echo "PROJECT ROOT: $ROOT"

          cd "$ROOT"

          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
