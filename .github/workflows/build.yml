name: Build IRAPP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: |
          ROOT=$(dirname "$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "Gradle project root: $ROOT"
          cd "$ROOT"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAPP-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
