name: Check IRAPP ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect ZIP
        run: |
          echo "=== ZIP FILE ==="
          ls -lh *.zip

          echo "=== ZIP CONTENTS ==="
          unzip -l IRAPP_v4.1.1_COMPLETE_2026-09-25.zip

          echo "=== SEARCH IMPORTANT FILES ==="
          unzip -l IRAPP_v4.1.1_COMPLETE_2026-09-25.zip | grep -E '(^|/)(gradlew|settings.gradle|build.gradle|build.gradle.kts)$' || true
